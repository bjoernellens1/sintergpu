[project]
name = "slang-rgbd-slam"
version = "0.1.0"
description = "Dense GPU RGB-D SLAM, local bundle adjustment, loop verification and TSDF mapping"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=2,<3", "Pillow>=11"]

[project.optional-dependencies]
gpu = ["caspar-slang[gpu]"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
slang-rgbd-slam = "slang_rgbd_slam.cli:main"

[tool.uv.sources]
caspar-slang = { git = "https://github.com/bjoernellens1/caspar-slang.git", rev = "cab53390aa111cd5526cb30c9aef484e73521186" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slang_rgbd_slam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
