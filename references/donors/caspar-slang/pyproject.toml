[project]
name = "caspar-slang"
version = "0.1.0"
description = "Experimental Slang/Vulkan backend for SymForce Caspar GPU code generation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Björn Ellensohn"}]
dependencies = []

[project.optional-dependencies]
symforce = ["symforce>=0.12,<0.13"]
gpu = ["slangpy>=0.43.1,<0.44", "numpy>=2,<3", "symforce>=0.12,<0.13"]
dev = ["pytest>=8", "ruff>=0.8", "numpy>=2,<3"]

[project.scripts]
caspar-slang = "caspar_slang.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caspar_slang"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
