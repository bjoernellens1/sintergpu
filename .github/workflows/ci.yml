name: CI
on:
  push:
    branches: ['main', 'impl/**']
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  cpu-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install native compile prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev
      - run: python -m pip install '.[test]' build 'setuptools>=77' wheel
      - run: python -m pytest tests -q
      - name: Verify compact SlangPy adapter with fake devices
        env:
          PYTHONPATH: src:.
          VK_DRIVER_FILES: /nonexistent/sintergpu-no-vulkan-icd.json
          VK_ICD_FILENAMES: /nonexistent/sintergpu-no-vulkan-icd.json
        run: |
          python -m pip install 'slangpy==0.43.1'
          python -c "import importlib.metadata; assert importlib.metadata.version('slangpy') == '0.43.1'"
          python -m pytest tests/test_compact_record.py -q --junitxml=build/compact-record.xml
          python - <<'PYCHECK'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/compact-record.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          tests = sum(int(s.get('tests', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          assert tests == 12 and skipped == 0, f'compact adapter gate: {tests} tests, {skipped} skipped'
          PYCHECK
      - name: Run frozen VKL Torch references on CPU
        env:
          PYTHONPATH: src
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pytest tests/test_vkl*.py -q
          python -m pytest tests/test_compact_backward_torch_cpu_profile.py -q -k 'not test_compiles_and_reflects' --junitxml=build/compact-torch.xml
          python - <<'PYCHECK'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/compact-torch.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          tests = sum(int(s.get('tests', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          assert tests >= 65 and skipped == 0, f'compact Torch gate: {tests} tests, {skipped} skipped'
          PYCHECK
      - name: Verify compact backward profile fake-device fixtures
        env:
          PYTHONPATH: src:.
          VK_DRIVER_FILES: /nonexistent/sintergpu-no-vulkan-icd.json
          VK_ICD_FILENAMES: /nonexistent/sintergpu-no-vulkan-icd.json
        run: |
          python -m pytest tests/test_compact_backward_profile_gpu_fixture.py -q --junitxml=build/compact-backward-fixture.xml
          python - <<'PYCHECK'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/compact-backward-fixture.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          tests = sum(int(s.get('tests', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          assert tests == 17 and skipped == 0, f'compact backward fixture gate: {tests} tests, {skipped} skipped'
          PYCHECK
      - run: python tools/check_provenance.py
      - run: python tools/update_timings.py --check
      - name: Require changelog classification and versioning
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/check_changes.py --base "$BASE_SHA"
      - run: python -m build
      - name: Check package bytes against tracked sources before release
        run: |
          python - <<'PYVERIFY'
          from pathlib import Path
          from tools.release import verify_package_sources
          root = Path.cwd()
          version = (root / 'VERSION').read_text().strip()
          wheel, = (root / 'dist').glob('sintergpu-' + version + '-*.whl')
          verify_package_sources(root, wheel, 'wheel')
          verify_package_sources(root, root / 'dist' / ('sintergpu-' + version + '.tar.gz'), 'sdist')
          PYVERIFY
      - name: Build a C++ consumer from a relocated installation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev
          cmake -S . -B build/cmake -DCMAKE_INSTALL_PREFIX=/tmp/sintergpu-install
          cmake --install build/cmake
          mv /tmp/sintergpu-install /tmp/sintergpu-relocated
          cmake -S examples/cmake -B build/consumer -DCMAKE_PREFIX_PATH=/tmp/sintergpu-relocated
          cmake --build build/consumer
          mkdir -p build/compact-discovery
          cat > build/compact-discovery/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.25)
          project(compact_discovery LANGUAGES CXX)
          find_package(sintergpu CONFIG REQUIRED)
          foreach(shader compact_batched compact_backward_torch_cpu_profile)
            file(SHA256 "${SINTERGPU_KERNEL_DIR}/vkl/${shader}.slang" installed_hash)
            file(SHA256 "${SOURCE_ROOT}/src/sintergpu/kernels/vkl/${shader}.slang" source_hash)
            if(NOT installed_hash STREQUAL source_hash)
              message(FATAL_ERROR "Installed compact shader differs: ${shader}")
            endif()
          endforeach()
          CMAKE
          cmake -S build/compact-discovery -B build/compact-discovery-build -DCMAKE_PREFIX_PATH=/tmp/sintergpu-relocated -DSOURCE_ROOT="$GITHUB_WORKSPACE"
      - name: Verify source and wheel installs without GPU extras
        run: |
          python -m venv /tmp/sintergpu-wheel
          /tmp/sintergpu-wheel/bin/pip install dist/*.whl
          cd /tmp
          cat > /tmp/check-compact-install.py <<'PYINSTALL'
          import hashlib, os
          from pathlib import Path
          import sintergpu
          from sintergpu import kernel_path, module_path
          from sintergpu.catalog import validate_catalog
          from sintergpu.compact_plan import plan_compact
          from sintergpu.compact_record import PreparedCompact
          assert not validate_catalog()
          source = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert not Path(sintergpu.__file__).resolve().is_relative_to(source)
          for module, entries in {
              'compact_batched': ('compactInit', 'compactFlags', 'compactScatterMetadata', 'compactFinalizeCounts', 'compactGatherWords'),
              'compact_backward_torch_cpu_profile': ('backwardProfileInit', 'backwardProfileInverse', 'backwardProfileGather'),
          }.items():
              path = module_path('vkl.' + module).resolve()
              assert not path.is_relative_to(source)
              expected = source / 'src/sintergpu/kernels/vkl' / (module + '.slang')
              assert hashlib.sha256(path.read_bytes()).digest() == hashlib.sha256(expected.read_bytes()).digest()
              for entry in entries:
                  assert kernel_path('vkl.' + module + '.' + entry).resolve() == path
          PYINSTALL
          /tmp/sintergpu-wheel/bin/python /tmp/check-compact-install.py
          python -m venv /tmp/sintergpu-source
          /tmp/sintergpu-source/bin/pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          /tmp/sintergpu-source/bin/python /tmp/check-compact-install.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: dist/*
  compiler:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '2026.12'
            sha256: 2409ecc7b6710783e05fd59792558c275c637e3e3c37fb5054fcfc858e570d82
          - version: '2026.19'
            sha256: bd6cfc47b7353b2cffa36a866b1584749f76f4b2dbebf6dda26bc3fb40dc3c0e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch checksum-pinned compiler
        env:
          SLANG_VERSION: ${{ matrix.version }}
          SLANG_SHA256: ${{ matrix.sha256 }}
        run: |
          curl --fail --location --retry 3 "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz" -o /tmp/slang.tar.gz
          echo "${SLANG_SHA256}  /tmp/slang.tar.gz" | sha256sum --check
          mkdir /tmp/slang
          tar -xzf /tmp/slang.tar.gz -C /tmp/slang
      - name: Compile and reflect every catalog entry
        env:
          SLANG_VERSION: ${{ matrix.version }}
        run: |
          python tools/compile_shaders.py --slangc /tmp/slang/bin/slangc --output "build/compile-${SLANG_VERSION}"
          python -c 'import json,os,pathlib; p=pathlib.Path("build/compile-"+os.environ["SLANG_VERSION"]+"/results.json"); r=json.loads(p.read_text()); r["pinned_release"]=os.environ["SLANG_VERSION"]; p.write_text(json.dumps(r,indent=2)+"\n")'
      - name: Verify camera registration ABI and capabilities (Slang ${{ matrix.version }})
        env:
          SLANG_VERSION: ${{ matrix.version }}
          SINTERGPU_CAMERA_COMPILER_VERSION: ${{ matrix.version }}
          SINTERGPU_SPIRV_DIS: /usr/bin/spirv-dis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y spirv-tools
          python -m pip install pytest 'numpy>=2'
          test -x /tmp/slang/bin/slangc
          test -x "$SINTERGPU_SPIRV_DIS"
          test "$(/tmp/slang/bin/slangc -version 2>&1)" = "$SLANG_VERSION"
          export "SINTERGPU_SLANGC_${SLANG_VERSION//./_}=/tmp/slang/bin/slangc"
          PYTHONPATH=src:. python -m pytest tests/test_vkl_camera_registration_hot_path.py -v --junitxml=build/camera-abi.xml
          python - <<'PYCHECK'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/camera-abi.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          tests = sum(int(s.get('tests', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          assert tests >= 19 and skipped == 0, f'camera ABI gate: {tests} tests, {skipped} skipped'
          PYCHECK
      - name: Verify compact shader reflection (Slang ${{ matrix.version }})
        env:
          SLANG_VERSION: ${{ matrix.version }}
          SINTERGPU_SPIRV_DIS: /usr/bin/spirv-dis
        run: |
          test -x /tmp/slang/bin/slangc
          test -x "$SINTERGPU_SPIRV_DIS"
          test "$(/tmp/slang/bin/slangc -version 2>&1)" = "$SLANG_VERSION"
          export "SINTERGPU_SLANGC_${SLANG_VERSION//./_}=/tmp/slang/bin/slangc"
          PYTHONPATH=src:. python -m pytest tests/test_vkl_compact_shader.py tests/test_vkl_compact_backward_shader.py tests/test_compact_backward_torch_cpu_profile.py tests/test_packaged_vkl_compact_assets.py -q -k "$SLANG_VERSION" --junitxml=build/compact-abi.xml
          python - <<'PYCHECK'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/compact-abi.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          tests = sum(int(s.get('tests', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          assert tests == 19 and skipped == 0, f'compact ABI gate: {tests} tests, {skipped} skipped'
          PYCHECK
      - name: Verify point-plane module imports, instructions and ABI
        env:
          SLANG_VERSION: ${{ matrix.version }}
        run: |
          python -m pip install 'numpy>=2'
          python tools/check_point_plane_module.py --slangc /tmp/slang/bin/slangc --output "build/point-plane-${SLANG_VERSION}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: point-plane-${{ matrix.version }}
          path: build/point-plane-${{ matrix.version }}/results.json
      - name: Build and consume relocated optional native package
        env:
          SINTERGPU_NATIVE_PACKAGE_TESTS: '1'
          SINTERGPU_TEST_VOLK: ${{ github.workspace }}/build/native-volk
          SINTERGPU_SLANGC: /tmp/slang/bin/slangc
          SINTERGPU_NATIVE_TEST_EVIDENCE: build/native-packaging-${{ matrix.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev
          python -m pip install pytest 'cmake==3.25.2'
          python - <<'PYDEPS'
          import json,pathlib,urllib.request
          pin=json.loads(pathlib.Path('tests/native/volk.json').read_text())
          out=pathlib.Path('build/native-volk');out.mkdir(parents=True,exist_ok=True)
          for name in pin['files']:
              url='https://raw.githubusercontent.com/zeux/volk/'+pin['revision']+'/'+name
              (out/name).write_bytes(urllib.request.urlopen(url,timeout=30).read())
          PYDEPS
          # Tests verify dependency bytes before compiling any downloaded code.
          python -m pytest tests/test_native_packaging.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-packaging-${{ matrix.version }}
          path: build/native-packaging-${{ matrix.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compiler-${{ matrix.version }}
          path: build/compile-${{ matrix.version }}/results.json
  reflection-compatibility:
    needs: compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compiler-2026.12
          path: build/abi-2026.12
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compiler-2026.19
          path: build/abi-2026.19
      - run: python tools/compare_reflection.py --left build/abi-2026.12/results.json --right build/abi-2026.19/results.json --output build/reflection-compatibility.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reflection-compatibility
          path: build/reflection-compatibility.json
  generated-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install optional pinned generation dependencies
        run: python -m pip install '.[test]' 'symforce==0.12.0'
      - name: Check owned adapters against frozen references and generation bytes
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest tests/test_point_plane_codegen.py -q
          python tools/regenerate_math.py --check
